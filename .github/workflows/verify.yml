name: verify
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: "Also run the slow Paper B searches"
        type: boolean
        default: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install sympy numpy mpmath python-sat
      - run: chmod +x verify_all.sh code/two_distance/prove_chi7.sh
      - run: ./verify_all.sh ${{ inputs.full && '--full' || '' }}
